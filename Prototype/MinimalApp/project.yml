name: MinimalApp
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  MinimalApp:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.localsigner.minimal
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: SignTest
        TARGETED_DEVICE_FAMILY: "1"
        ARCHS: arm64
        CODE_SIGNING_ALLOWED: NO
