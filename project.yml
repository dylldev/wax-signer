name: LocalIPASigner
options:
  bundleIdPrefix: io.github.dylldev
  deploymentTarget:
    iOS: "17.0"
packages:
  IPAKit:
    path: .
targets:
  LocalIPASigner:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: IPAKit
      - package: IPAKit
        product: CredentialKit
      - package: IPAKit
        product: SigningKit
      - package: IPAKit
        product: InstallKit
      - package: IPAKit
        product: SourcesKit
    info:
      path: App/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers: ["$(PRODUCT_BUNDLE_IDENTIFIER).signing"]
        LSApplicationQueriesSchemes: ["waxprobe"]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Wax
        UILaunchScreen: {}
    settings:
      base:
        MARKETING_VERSION: "0.14.0"
        CURRENT_PROJECT_VERSION: "98"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wax
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dylldev.wax
        CODE_SIGN_ENTITLEMENTS: App/LocalIPASigner.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: YES
  IPAKitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/IPAKitTests]
    dependencies:
      - package: IPAKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  CredentialAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CredentialKitTests
        excludes: [generate_fixtures.py]
    dependencies:
      - target: LocalIPASigner
      - package: IPAKit
        product: CredentialKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SigningAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SigningKitTests
        excludes: [Fixtures]
      - path: Tests/SigningKitTests/Fixtures/TestApp.app
        type: folder
        buildPhase: resources
      - path: Tests/SigningKitTests/Fixtures/TestApp.ipa
        buildPhase: resources
    dependencies:
      - target: LocalIPASigner
      - package: IPAKit
        product: CredentialKit
      - package: IPAKit
        product: SigningKit
      - package: IPAKit
        product: IPAKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
